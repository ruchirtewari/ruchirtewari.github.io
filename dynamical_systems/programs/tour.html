// ─────────────────────────────────────────────────────────────────────────────
// State
// ─────────────────────────────────────────────────────────────────────────────
let currentStep = 0;
let currentInstance = null;
const loadedModules = {};   // moduleVar → promise

// ─────────────────────────────────────────────────────────────────────────────
// Build sidebar
// ─────────────────────────────────────────────────────────────────────────────
(function buildSidebar() {
  const inner = document.getElementById('sidebar-inner');
  let lastCh = null;
  TOUR.forEach((prog, i) => {
    if (prog.chapterTitle !== lastCh) {
      lastCh = prog.chapterTitle;
      const lbl = document.createElement('div');
      lbl.className = 'ch-label';
      lbl.textContent = prog.chapterTitle;
      inner.appendChild(lbl);
      const grp = document.createElement('div');
      grp.className = 'ch-group';
      grp.id = `grp-${i}`;
      inner.appendChild(grp);
    }
    const link = document.createElement('div');
    link.className = 'prog-link';
    link.id = `link-${i}`;
    // Find section text from prog.sections
    const secStr = prog.sections.map(s => '§' + s).join(', ');
    link.innerHTML = `${secStr}<br><span style="color:var(--text);font-size:1.05em">${prog.id.replace(/([A-Z])/g, ' $1').trim()}</span>`;
    if (prog.spotlight) link.innerHTML += ` <span style="color:var(--accent)">★</span>`;
    link.addEventListener('click', () => navigate(i));
    // Append to last group
    const groups = inner.querySelectorAll('.ch-group');
    groups[groups.length - 1].appendChild(link);
  });
})();

// ─────────────────────────────────────────────────────────────────────────────
// Load a module lazily (returns promise of the module object)
// ─────────────────────────────────────────────────────────────────────────────
function loadModule(prog) {
  if (loadedModules[prog.id]) return loadedModules[prog.id];
  const p = new Promise((resolve, reject) => {
    if (window[prog.id]) { resolve(window[prog.id]); return; }
    const s = document.createElement('script');
    s.src = prog.file;
    s.onload  = () => window[prog.id] ? resolve(window[prog.id]) : reject(new Error('Module not exported: ' + prog.id));
    s.onerror = () => reject(new Error('File not found: ' + prog.file));
    document.head.appendChild(s);
  });
  loadedModules[prog.id] = p;
  return p;
}

// ─────────────────────────────────────────────────────────────────────────────
// Navigate to step index
// ─────────────────────────────────────────────────────────────────────────────
function navigate(idx) {
  if (idx < 0 || idx >= TOUR.length) return;

  // Destroy current instance
  if (currentInstance) { try { currentInstance.destroy(); } catch(e) {} currentInstance = null; }
  document.getElementById('viz-container').innerHTML = '';

  currentStep = idx;
  const prog = TOUR[idx];

  // Update sidebar
  document.querySelectorAll('.prog-link').forEach((el, i) =>
    el.classList.toggle('active', i === idx));
  document.getElementById(`link-${idx}`)?.scrollIntoView({ block: 'nearest' });

  // Update step counter + progress
  document.getElementById('step-counter').textContent = `${idx + 1} / ${TOUR.length}`;
  document.getElementById('progress-fill').style.width = `${((idx + 1) / TOUR.length) * 100}%`;

  // Prev/next buttons
  document.getElementById('btn-prev').disabled = idx === 0;
  document.getElementById('btn-next').disabled = idx === TOUR.length - 1;

  // Update header
  const titleEl = document.getElementById('prog-title');
  titleEl.innerHTML = prog.id.replace(/([A-Z])/g, ' $1').trim() +
    (prog.spotlight ? ' <span class="spotlight-tag">★ featured</span>' : '');

  const badgesEl = document.getElementById('badges');
  badgesEl.innerHTML =
    `<span class="badge badge-ch">${prog.chapterTitle}</span>` +
    prog.sections.map(s => `<span class="badge badge-sec">§${s}</span>`).join('') +
    `<span class="badge badge-concept">${prog.concept}</span>`;

  // Update text panel
  document.getElementById('concept-box').textContent = prog.concept;
  document.getElementById('narrative').innerHTML = prog.narrative;
  const hintsList = document.getElementById('hints');
  hintsList.innerHTML = (prog.hints || []).map(h => `<li>${h}</li>`).join('');
  const mathNote = document.getElementById('math-note');
  if (prog.math) {
    mathNote.style.display = '';
    mathNote.innerHTML = prog.math;
  } else {
    mathNote.style.display = 'none';
  }

  // Load + init visualization
  const status = document.getElementById('viz-status');
  const container = document.getElementById('viz-container');
  status.textContent = 'Loading…';
  status.className = '';
  status.style.display = '';

  loadModule(prog).then(mod => {
    status.style.display = 'none';
    try {
      currentInstance = mod.init(container);
    } catch (e) {
      status.textContent = 'Init error: ' + e.message;
      status.className = 'error';
      status.style.display = '';
      console.error(e);
    }
  }).catch(err => {
    status.textContent = err.message;
    status.className = 'error';
    status.style.display = '';
  });

  // Update URL hash for bookmarking
  history.replaceState(null, '', '#' + idx);
}

// ─────────────────────────────────────────────────────────────────────────────
// Keyboard navigation
// ─────────────────────────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   { e.preventDefault(); navigate(currentStep - 1); }
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown')  { e.preventDefault(); navigate(currentStep + 1); }
});

document.getElementById('btn-prev').addEventListener('click', () => navigate(currentStep - 1));
document.getElementById('btn-next').addEventListener('click', () => navigate(currentStep + 1));

// ─────────────────────────────────────────────────────────────────────────────
// Initial load — respect URL hash
// ─────────────────────────────────────────────────────────────────────────────
const hashIdx = parseInt(location.hash.slice(1), 10);
navigate(isNaN(hashIdx) ? 0 : Math.max(0, Math.min(hashIdx, TOUR.length - 1)));
</script>
