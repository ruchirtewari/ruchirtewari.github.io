<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DeepSeek Papers Map</title>
<meta name="description" content="Timeline and thematic map of DeepSeek research papers, 2024 to 2026.">
<style>
  :root {
    --bg: #f7f6f3; --panel: #ffffff; --ink: #1f2430; --muted: #6b7280; --line: #e3e1da;
    --accent: #2653d4; --accent-soft: #e8eeff; --shadow: 0 1px 2px rgba(0,0,0,.05), 0 6px 20px rgba(20,30,60,.08);
    /* theme palette: one hue per lane */
    --t-scale: #2653d4; --t-moe: #0f8a6a; --t-attn: #b3411f; --t-rl: #7b3fb8;
    --t-mem: #c48a00; --t-topo: #c2285f; --t-dom: #0e7c9c;
    --mono: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141720; --panel: #1d2130; --ink: #e8eaf1; --muted: #9aa1b4; --line: #2c3245;
      --accent: #7c9cff; --accent-soft: #232c4a; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
      --t-scale: #7c9cff; --t-moe: #4fd1a5; --t-attn: #ff9a6b; --t-rl: #c59bff;
      --t-mem: #ffd166; --t-topo: #ff7fa8; --t-dom: #5fd3ef;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141720; --panel: #1d2130; --ink: #e8eaf1; --muted: #9aa1b4; --line: #2c3245;
    --accent: #7c9cff; --accent-soft: #232c4a; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    --t-scale: #7c9cff; --t-moe: #4fd1a5; --t-attn: #ff9a6b; --t-rl: #c59bff;
    --t-mem: #ffd166; --t-topo: #ff7fa8; --t-dom: #5fd3ef;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--ink); line-height: 1.45;
  }
  a { color: var(--accent); }

  /* ── Header ── */
  header {
    position: sticky; top: 0; z-index: 20; background: var(--panel); border-bottom: 1px solid var(--line);
    padding: 12px 20px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  header h1 { font-size: 17px; font-weight: 700; letter-spacing: -.01em; }
  header .sub { font-size: 12px; color: var(--muted); }
  .spacer { flex: 1; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button {
    border: 0; background: transparent; color: var(--ink); padding: 7px 14px; font-size: 13px; cursor: pointer; font-weight: 600;
  }
  .seg button.active { background: var(--accent); color: #fff; }
  .seg button:not(.active):hover { background: var(--accent-soft); }
  .iconbtn {
    border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 8px;
    padding: 6px 10px; font-size: 13px; cursor: pointer;
  }
  .iconbtn:hover { background: var(--accent-soft); }

  /* ── Legend / filter chips ── */
  #legend { display: flex; gap: 8px; flex-wrap: wrap; padding: 12px 20px 0; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--panel); font-size: 12px; cursor: pointer; user-select: none;
    color: var(--ink);
  }
  .chip .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c); }
  .chip.active { border-color: var(--c); box-shadow: inset 0 0 0 1px var(--c); }
  .chip.dim { opacity: .45; }
  .hint { font-size: 12px; color: var(--muted); padding: 6px 20px 0; }

  /* ── Views ── */
  main { padding: 12px 20px 60px; max-width: 1400px; margin: 0 auto; }
  body[data-view="themes"] main { max-width: 1900px; }
  .view { display: none; }
  .view.active { display: block; animation: fadein .25s ease; }
  @keyframes fadein { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  /* Timeline */
  .yearrow { display: grid; grid-template-columns: 90px 1fr; gap: 0 16px; position: relative; padding: 18px 0; }
  .yearrow + .yearrow { border-top: 1px dashed var(--line); }
  .yearlabel { position: sticky; top: 64px; align-self: start; }
  .yearlabel .y { font-size: 30px; font-weight: 800; letter-spacing: -.03em; line-height: 1; }
  .yearlabel .n { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .yearlabel .axis { position: absolute; left: 70px; top: 0; bottom: 0; width: 2px; background: var(--line); }
  .papers { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }

  .block {
    position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 14px 12px 16px; cursor: pointer; box-shadow: var(--shadow);
    transition: transform .15s ease, box-shadow .15s ease, opacity .2s ease; text-align: left; color: var(--ink);
    font: inherit; display: block; width: 100%;
  }
  .block::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 4px; border-radius: 4px; background: var(--c, var(--accent)); }
  .block:hover, .block:focus-visible { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(20,30,60,.16); outline: none; }
  .block.dim { opacity: .25; }
  .block.release { border-style: dashed; }
  .block.external { border-style: dotted; border-color: var(--muted); background: transparent; }
  .block.external .name { font-style: italic; }
  .block .date { font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .block .name { font-size: 15px; font-weight: 700; margin: 2px 0 3px; }
  .block .tag { font-size: 12.5px; color: var(--muted); line-height: 1.35; }
  .block .tdots { display: flex; gap: 4px; margin-top: 8px; }
  .block .tdots span { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .block .kind { display: inline-block; margin-left: 6px; padding: 0 5px; border-radius: 4px; border: 1px solid var(--line); font-size: 9.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); vertical-align: 1px; }

  /* Themes */
  #themes-wrap { position: relative; }
  #edges { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
  #edges path { fill: none; stroke-width: 1.8; opacity: .7; }
  #edges path.hl { stroke-width: 3; opacity: 1; }
  #edges path.faded { opacity: .08; }
  .capstone { position: relative; z-index: 2; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; margin-bottom: 26px; }
  .capstone .block { border-width: 2px; }
  .caplabel { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin: 0 0 8px; }
  .laneheads, .lanes { position: relative; z-index: 2; display: grid; grid-template-columns: repeat(7, minmax(215px, 1fr)); gap: 12px; }
  .laneheads { margin-bottom: 14px; }
  .lanes { align-items: start; }
  #view-themes.compact .block .note, #view-themes.compact .block .ev { display: none; }
  #btn-notes { display: none; }
  body[data-view="themes"] #btn-notes { display: inline-block; }
  .lane { display: flex; flex-direction: column-reverse; gap: 22px; min-height: 120px; }
  .lanehead {
    font-size: 12px; font-weight: 700; padding: 6px 10px; border-radius: 8px; cursor: pointer; text-align: left; font-family: inherit;
    background: var(--panel); border: 1px solid var(--c); color: var(--c);
  }
  .lanehead:hover { background: var(--accent-soft); }
  .lanehead .more { display: block; font-weight: 400; color: var(--muted); font-size: 10.5px; margin-top: 2px; }
  #drawer .story { font-size: 14.5px; line-height: 1.55; }
  #drawer .today { background: var(--accent-soft); border-radius: 8px; padding: 10px 12px; font-size: 14px; }
  .lanehead small { display: block; font-weight: 400; color: var(--muted); font-size: 11px; }
  .lane .block { padding: 10px 12px 10px 14px; }
  .lane .block .name { font-size: 13.5px; }
  .lane .block .tag { font-size: 12px; }
  .lane .block .note, .capstone .block .note { font-size: 12px; color: var(--ink); opacity: .85; margin-top: 6px; line-height: 1.4; }
  .lane .block .ev, .capstone .block .ev { font-family: var(--mono); font-size: 10.5px; color: var(--muted); margin-top: 6px; line-height: 1.35; border-top: 1px dashed var(--line); padding-top: 5px; }
  .lane .block .refs { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px; }
  .refs span { font-family: var(--mono); font-size: 10.5px; padding: 1px 6px; border-radius: 4px; background: var(--accent-soft); color: var(--ink); }
  .block.hl { box-shadow: 0 0 0 2px var(--c), var(--shadow); }
  .lanes-scroll { overflow-x: auto; padding-bottom: 8px; }

  /* Drawer */
  #overlay { position: fixed; inset: 0; background: rgba(10,14,30,.35); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 30; }
  #overlay.open { opacity: 1; pointer-events: auto; }
  #drawer {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100%); background: var(--panel); z-index: 31;
    transform: translateX(100%); transition: transform .25s ease; overflow-y: auto; border-left: 1px solid var(--line);
    padding: 22px 26px 40px;
  }
  #drawer.open { transform: none; }
  #drawer .close { position: absolute; right: 14px; top: 12px; }
  #drawer .eyebrow { font-family: var(--mono); font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  #drawer h2 { font-size: 21px; line-height: 1.25; margin-bottom: 4px; padding-right: 50px; }
  #drawer .full { font-size: 13.5px; color: var(--muted); margin-bottom: 14px; }
  #drawer .themes { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
  #drawer .themes span { font-size: 11.5px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--c); color: var(--c); }
  #drawer h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin: 18px 0 8px; }
  #drawer p { font-size: 14.5px; margin-bottom: 10px; }
  #drawer ul { padding-left: 20px; font-size: 14px; }
  #drawer li { margin-bottom: 6px; }
  .links { display: flex; flex-wrap: wrap; gap: 8px; }
  .links a, .links button {
    font-size: 13px; padding: 6px 11px; border-radius: 8px; border: 1px solid var(--line); background: transparent;
    text-decoration: none; color: var(--ink); cursor: pointer; font-family: inherit;
  }
  .links a:hover, .links button:hover { background: var(--accent-soft); }
  .links a.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .note { font-size: 12.5px; color: var(--muted); background: var(--bg); border: 1px dashed var(--line); border-radius: 8px; padding: 8px 10px; margin-top: 8px; }
  .rel { list-style: none; padding: 0; }
  .rel li { margin-bottom: 4px; }
  .rel button { background: none; border: 0; color: var(--accent); cursor: pointer; font-size: 14px; text-align: left; font-family: inherit; padding: 0; }
  .rel button:hover { text-decoration: underline; }

  @media (max-width: 720px) {
    header { padding: 10px 16px; }
    main, #legend, .hint { padding-left: 16px; padding-right: 16px; }
    .yearrow { grid-template-columns: 1fr; }
    .yearlabel { position: static; display: flex; align-items: baseline; gap: 10px; margin-bottom: 8px; }
    .yearlabel .axis { display: none; }
    .yearlabel .y { font-size: 24px; }
    .laneheads, .lanes { grid-template-columns: repeat(7, 200px); }
    #drawer { padding: 18px 16px 40px; }
  }
</style>
</head>
<body>

<header>
  <div>
    <h1>DeepSeek Papers Map</h1>
    <div class="sub">2024 &rarr; 2026 &middot; click any block for its summary</div>
  </div>
  <div class="spacer"></div>
  <div class="seg" role="tablist">
    <button id="btn-timeline" class="active" role="tab">Timeline</button>
    <button id="btn-themes" role="tab">Themes</button>
  </div>
  <button class="iconbtn" id="btn-notes" title="Show or hide the evolution notes inside the blocks">Notes: on</button>
  <button class="iconbtn" id="btn-theme-toggle" title="Toggle light / dark">&#9681;</button>
</header>

<div id="legend"></div>
<div class="hint" id="hint"></div>

<main>
  <section id="view-timeline" class="view active"></section>
  <section id="view-themes" class="view">
    <div id="themes-wrap">
      <svg id="edges"></svg>
      <div class="caplabel">Where the ideas converge (most recent)</div>
      <div class="capstone" id="capstone"></div>
      <div class="caplabel">Building blocks, oldest at the bottom of each lane</div>
      <div class="lanes-scroll"><div class="laneheads" id="laneheads"></div><div class="lanes" id="lanes"></div></div>
    </div>
  </section>
</main>

<div id="overlay"></div>
<aside id="drawer" aria-hidden="true">
  <button class="iconbtn close" id="drawer-close" aria-label="Close">&#10005;</button>
  <div id="drawer-body"></div>
</aside>

<script>
/* =====================================================================
   DATA — edit this block to add papers, blocks, or summaries.

   papers[]:
     id        short key used by blocks and relations
     name      short display name
     title     full paper title
     date      ISO date (YYYY-MM-DD); used for ordering in the timeline
     kind      "paper" | "release" | "draft"  (release = model release notes, no arXiv paper;
                                                draft = entry whose citation is not yet confirmed)
     arxiv     arXiv id (optional)
     venue     extra venue note (optional)
     pdf       relative path to a local PDF (optional). Paths are relative to this HTML file.
     summary   relative path to a detailed summary (HTML or Markdown) — ADD LATER. Leave "" if none yet.
     themes    array of theme ids (see THEMES below)
     tag       one-line takeaway shown on the block
     abstract  a few sentences shown in the drawer
     points    bullet list of key contributions
     buildsOn  ids of earlier papers this one builds on (used for "builds on" / "leads to")

   blocks[]  (Themes view):
     id, lane (theme id), name, tag, papers (ids), buildsOn (block ids),
     note      2-4 sentences: the problem at that point, what changed vs the previous block, what carried forward
     evidence  one line of concrete numbers from the paper
   THEMES[] also carry:
     evolution paragraph tracing the thread oldest to newest
     today     why the thread matters for the newest model
   ===================================================================== */
const THEMES = [
  { id: "scale", name: "Scaling & data",          sub: "laws, corpora, training recipes", color: "var(--t-scale)",
    evolution: "DeepSeek LLM treats scaling as measurement: it fits power laws for optimal batch size and learning rate against compute, replaces parameter count with non-embedding FLOPs per token, and derives a model versus data allocation used to train 7B and 67B dense models on 2T tokens under a multi-step learning rate schedule. DeepSeek-V3 shifts the mechanism to cost per token: FP8 mixed precision with tile and block scaling, DualPipe overlap and node-limited MoE communication let 14.8T tokens run in 2.788M H800 GPU hours with no irrecoverable loss spikes. DeepSeek-V4 changes the optimizer to Muon with hybrid Newton-Schulz orthogonalization, adds batch size scheduling, staged sequence lengths from 4K to 1M, and Anticipatory Routing plus SwiGLU clamping against loss spikes at 1.6T parameters over 32T tokens. DeepSeek-V4.1-Flash keeps that recipe but trains 45T multimodal tokens with sparse attention from scratch, FP4 KV caches during training and FP4 QAT afterwards, so training matches deployment.",
    today: "DeepSeek-V4.1-Flash is the direct product of this lane: a 45T-token run with no instability, sparse attention from step one, and FP4 caches trained rather than bolted on are what let a 552B backbone that activates 8B parameters in prefill match V4-Pro-Base with 1/3 of the total parameters. The recurring lesson from LLM through V4.1 is that each generation first lowered cost per training token (allocation, then precision and overlap, then optimizer, then training under deployment precision) and only then scaled the corpus." },
  { id: "moe",   name: "Sparse MoE",              sub: "experts, routing, load balance", color: "var(--t-moe)",
    evolution: "DeepSeekMoE set the expert layout: split each GShard-style expert into m finer pieces, activate mK of them, and isolate K_s always-on shared experts, with expert-level and device-level balance losses; 16B and 145B models matched dense quality at 40% or less of the compute. DeepSeek-V2 kept that layout at 236B total and 21B active and changed the communication side: device-limited routing sends each token to at most M devices, plus a communication balance loss and training-time token dropping. DeepSeek-V3 replaced the auxiliary losses with a routing-only bias term updated by an overload signal, moved to sigmoid affinities, added multi-token prediction, and limited tokens to 4 nodes with no dropping. DeepSeek-V4 removed the node constraint, switched affinities to Sqrt(Softplus), hash-routed the first 3 MoE layers, and reached 1.6T total with 49B active. DeepSeek-V4.1-Flash changed what an activated parameter means: the Causal Encoder-Decoder runs only the encoder in prefill, so 8B parameters are active in prefill and 16B in decode.",
    today: "V4.1-Flash still uses the DeepSeekMoE recipe from 2024, 1 shared expert plus 384 fine-grained routed experts with 6 active per token, balanced by the V3 bias term with a small sequence-level loss. What is new is that expert sparsity is paired with depth sparsity: because agentic workloads are prefill-heavy, CED halves prefill compute by activating only 8B of the 552B backbone during prefill while decode still gets 16B. The lane moved from cheaper training compute to cheaper serving compute per input token." },
  { id: "attn",  name: "Attention & KV cache",    sub: "compression, sparsity, context", color: "var(--t-attn)",
    evolution: "The thread starts with DeepSeek-V2's Multi-head Latent Attention, which replaces per-head keys and values with one low-rank latent vector per token plus a small decoupled RoPE key, cutting the cache without losing MHA quality. V3.2 keeps that latent entry but stops attending to all of them: a lightning indexer scores prior tokens and the main attention reads only the top-k latent entries, turning core attention from quadratic to linear in context, introduced by continued pretraining on V3.1-Terminus. V4 compresses along the sequence axis before selecting: CSA merges every 4 tokens into one entry and then runs DSA, HCA merges every 128 tokens and attends densely, with FP8 KV and FP4 indexer. V4.1 adds the layer axis: CSA2 layers share main KV and indexer keys, reuse Top-K indices, restrict deeper indexers to a candidate pool, and store main KV in FP4, reaching 890 bytes per token.",
    today: "DeepSeek-V4.1-Flash's serving economics rest on this lane: 890 bytes of global KV per token in HBM, persistent KV at 1/8 of V4-Flash, and decode FLOPs that grow by only a quarter from 4K to 1M context. Each step (shared latent entry, cheap indexer, sequence compression, cross-layer sharing) multiplied the previous one, which is what makes million-token agentic workloads affordable rather than exotic." },
  { id: "rl",    name: "Reasoning via RL",        sub: "GRPO, R1, post-training", color: "var(--t-rl)",
    evolution: "The thread starts with DeepSeekMath (Feb 2024), where GRPO drops PPO's value model and normalizes each sample's reward against a group of outputs for the same question, putting KL in the loss rather than the reward. R1 (Jan 2025) ran the same algorithm on V3-Base with only rule-based rewards and no SFT, and long chain-of-thought, reflection and an aha moment emerged; a cold-start and rejection-sampling pipeline made it usable. R1-0528 and V3.1 (2025) folded thinking and non-thinking into one serving model and pushed tool use. V3.2 (Dec 2025) made GRPO scale: unbiased KL gradient, off-policy sequence masking, keep-routing and keep-sampling masks, thousands of synthesized agent environments, RL compute above 10 percent of pre-training. V4 and V4.1 (2026) keep GRPO for domain specialists but replace mixed RL with multi-teacher on-policy distillation, add explicit reasoning-effort conditioning, and train the drafter and cache replay inside the RL loop.",
    today: "V4.1-Flash is post-trained with the same SFT, GRPO RL and on-policy distillation recipe that this lane built up, and the paper says outright that almost all remaining gains come from task and environment synthesis rather than new algorithms. The scalar effort signal learned in RL is what lets one model span cheap and maximal reasoning, and DSpark plus SWA Bounded Replay are trained inside the RL loop so the served model matches the trained one." },
  { id: "mem",   name: "Long context & memory",   sub: "context length, lookup memory", color: "var(--t-mem)",
    evolution: "Long context began as a post-training patch: V2 and V3 pretrain at 4K and then apply YaRN to the decoupled RoPE key for 1000-step extension phases to 32K and 128K, validated by needle-in-a-haystack. The Engram paper reframes memory itself: a hashed N-gram lookup table sits beside the MoE as a second sparsity axis, a U-shaped allocation law says 20 to 25 percent of sparse parameters belong in memory, and freeing attention from local patterns lifts long-context retrieval. V4 makes one million tokens native rather than an extension, growing sequence length 4K to 16K to 64K to 1M inside pretraining on compressed hybrid attention, with an on-disk KV hierarchy and a million-token RL stack. V4.1-Flash ships 196B of Engram in production with host-DRAM prefetch, trains sparse attention from scratch at 64K, extends to 1M at 34T tokens, and moves sliding-window KV out of persistent storage using SWA Bounded Replay.",
    today: "DeepSeek-V4.1-Flash runs one-million-token agentic sessions where the question is no longer how far attention can reach but where each kind of memory lives: global KV in HBM, sliding-window KV in a host DRAM pool with minute-scale TTL, prefix KV on SSD for 72 hours, and static knowledge in Engram tables prefetched from host memory. Extending RL to 1M context continued to improve extremely long-horizon tasks such as Terminal-Bench v3.0 (V4.1 Fig 7), so this lane directly sets what agents can hold in a single session." },
  { id: "topo",  name: "Residual topology",       sub: "hyper-connections, stability", color: "var(--t-topo)",
    evolution: "The thread starts from the plain residual connection, whose identity mapping keeps the average signal invariant across depth. Hyper-Connections (HC) widened the residual stream to n parallel streams with learnable mixing matrices, buying accuracy but losing that conservation property: composed mixing matrices amplified or attenuated signals without bound, so 27B training became unstable and memory traffic grew roughly n-fold. mHC (Dec 2025) restored the guarantee by projecting the residual mixing matrix onto the doubly stochastic manifold with Sinkhorn-Knopp, bounding its spectral norm by 1 and making stability compose across layers, and paid for the wider stream with fused TileLang kernels, block recomputation and an extended DualPipe schedule. DeepSeek-V4 (Apr 2026) adopted mHC unchanged at 284B and 1.6T scale with n equal 4 and 20 Sinkhorn iterations. V4.1-Flash (Sep 2026) changed the dataflow, not the math: Single-Pass mHC shifts input-mixing coefficients by one block so a single Mega-mHC kernel reads and writes the residual once, halving activation traffic.",
    today: "V4.1-Flash keeps the four-stream mHC residual as a standard component and trains 45T multimodal tokens with no instability, showing that the manifold constraint made a widened residual stream safe at frontier scale. Because V4.1-Flash is built for cheap decoding, the Single-Pass rewrite matters as much as the original idea: the residual stream is now memory-bound work, and reading it once per block is what keeps mHC affordable in deployment." },
  { id: "dom",   name: "Domains & modality",      sub: "code, math, vision, agents", color: "var(--t-dom)",
    evolution: "The domain thread begins with DeepSeek-Coder (Jan 2024), which showed that data construction is the lever: repository-level packing with topological dependency ordering, a fill-in-the-middle objective at a 50% PSM rate, and a 16K window on 2T tokens that were 87% code. DeepSeekMath (Feb 2024) reused Coder-Base-v1.5 as the starting point and changed the data engine to an iterative fastText classifier over Common Crawl, yielding a 120B-token math corpus and 51.7% on MATH after GRPO. DeepSeek-VL (Mar 2024) added a modality with a hybrid SigLIP-L plus SAM-B encoder at 1024x1024 and learned that language data must stay near 70% to avoid forgetting. The 2025 releases (R1-0528, V3.1, V3.2) moved the focus from domain corpora to agents: thinking inside tool calls and synthesized environments. V4.1-Flash (Sep 2026) folds vision into the backbone from the first pre-training token with a from-scratch DeepSeek-ViT and 45T multimodal tokens.",
    today: "V4.1-Flash is a single multimodal MoE that is evaluated mainly as an agent: Terminal-Bench, DeepSWE and AutomationBench for text, and Chartography, BabyVision and ZeroBench with tools for vision. Every ingredient traces back to this lane: code and math corpora set the pre-training recipe, VL established the encoder-plus-projector path and the text-to-image data ratio, and V3.2 supplied the agentic task synthesis that now drives RL." },
];

    note: "V4 states it inherits the DeepSeekMoE FFN, the auxiliary-loss-free bias strategy with a slight sequence-wise balance loss, and unmodified MTP from V3, with only minor MoE adjustments: affinity scores use Sqrt(Softplus) instead of sigmoid, the constraint on routing target nodes is removed with parallelism redesigned to compensate, and the initial dense FFN blocks become hash-routed MoE layers. Scaling to 1.6T parameters surfaced loss spikes tied to MoE outliers, addressed by Anticipatory Routing (routing indices from lagged parameters) and SwiGLU clamping.",

  { id: "b-ced", lane: "moe", name: "Causal Encoder-Decoder", tag: "Causal Encoder-Decoder: 8B active in prefill, 16B in decode",
    note: "Long-horizon agents make workloads input-heavy: frequent tool calls generate large prefill requests on KV cache misses, so prefill compute drives cost. V4.1-Flash keeps the V4 MoE layer (1 shared plus 384 routed, 6 active, SwiGLU clamped at 10) but stacks it as a 20-layer causal encoder and 20-layer decoder; decoder global KV is projected from the final encoder hidden state, so prefill runs only the encoder and decode runs all 40. Inspired by YOCO, this nearly halves prefill complexity from O(NL) to about O(NL/2); load balancing is unchanged from V4.",

  // attn
  { id: "b-yoco", lane: "attn", name: "YOCO (external)", tag: "Cache global KV once; prefill exits after the self-decoder",
    note: "External idea from Microsoft Research, not a DeepSeek paper. The bottom half of the layers uses windowed or recurrent attention with constant state; a single global KV pair is projected from its output and shared by every upper layer, so prefill stops halfway. The cost is one undifferentiated cache for all upper layers and no global attention below the split. V4.1 borrows the split but gives each decoder layer its own KV projection and keeps sparse global attention in the encoder.",

    papers: ["yoco"], buildsOn: [] },
  { id: "b-mla", lane: "attn", name: "Multi-head Latent Attention", tag: "Multi-head Latent Attention: one low-rank latent per token replaces KV",
    note: "In 2024 the KV cache of multi-head attention (2 heads times head dim per layer per token) capped batch size and sequence length at serving, and MQA or GQA cut it only by losing quality. MLA down-projects each token into a single latent c_KV that is cached, with up-projections absorbed into the query and output matrices; a small decoupled RoPE key carries position because RoPE cannot be absorbed. The shared latent entry became the substrate every later sparse scheme selects over.",

  { id: "b-dsa", lane: "attn", name: "DeepSeek Sparse Attention", tag: "DeepSeek Sparse Attention: lightning indexer picks top-k latent entries",
    note: "By late 2025 the 128K context made dense attention over MLA latents the dominant cost. DSA adds a lightning indexer (few heads, ReLU, FP8) that scores each query against prior tokens, and the main attention reads only the top-k=2048 latent entries, run in MLA's MQA mode so one latent serves all query heads. It was grafted onto V3.1-Terminus by continued pretraining: a dense warm-up trains only the indexer with a KL loss, then a sparse stage trains everything. Core attention drops from O(L^2) to O(Lk).",

  { id: "b-csa", lane: "attn", name: "CSA + HCA hybrid attention", tag: "Hybrid CSA and HCA: compress KV along the sequence, then go sparse",
    note: "Targeting one million tokens, even O(Lk) attention plus an O(L^2) indexer was too heavy. V4 compresses first: CSA folds every m=4 tokens into one KV entry (built from 2m overlapped entries) and then applies DSA over compressed entries with top-k 512 (Flash) or 1024 (Pro); HCA folds every m'=128 tokens into one entry and attends densely. Layers interleave the two; a 128-token sliding-window branch and attention sinks recover local detail. KV is stored FP8 with BF16 RoPE dims and the indexer runs in FP4.",
    evidence: "At 1M tokens V4-Pro needs 27% of single-token FLOPs and 10% of KV cache vs V3.2, V4-Flash 10% and 7%; KV about 2% of a BF16 GQA8 baseline (V4 abstract, §1, §2.3.4)", papers: ["v4"], buildsOn: ["b-dsa"] },
  { id: "b-csa2", lane: "attn", name: "CSA2 + FP4 KV: 890 B/token", tag: "CSA2: cross-layer KV and index reuse with FP4 main KV cache",
    note: "With entry size (MLA) and sequence (CSA) already compressed, V4.1 attacks the layer axis. Each CSA2 layer is Full (own KV, own indexing), Reindex (reuse KV, rescore), or Reuse (reuse KV and Top-K indices); the encoder uses 1 Full plus 5 Reuse per group at m=2, the decoder m=1 in groups of four. A Hierarchical Sparse Indexer limits decoder indexers to a candidate pool, so their cost stops growing with context. Main KV moves to FP4 via QAT, and pure CSA2 replaces the CSA/HCA hybrid.",

  // rl
  { id: "b-grpo", lane: "rl", name: "GRPO", tag: "GRPO: group-normalized advantages replace PPO's critic for math RL",
    note: "PPO needs a value model as large as the policy, yet LLM rewards arrive only at the last token, so per-token value estimation is hard and costly. GRPO samples a group of outputs per question and uses each reward minus the group mean, divided by the group std, as the advantage for every token, with an unbiased KL to the reference model added directly in the loss. The paper also frames SFT, RFT, DPO, PPO and GRPO as one gradient form differing in data source, reward and gradient coefficient.",
    evidence: "DeepSeekMath-RL 7B MATH 46.8% to 51.7% and GSM8K 82.9% to 88.2% with 64 samples per question, KL coefficient 0.04, lr 1e-6 on ~144K questions (DeepSeekMath abstract, §4.2)", papers: ["math"], buildsOn: [] },
  { id: "b-r1", lane: "rl", name: "R1-Zero / R1", tag: "R1-Zero and R1: reasoning emerges from pure rule-rewarded RL",

  { id: "b-hybrid", lane: "rl", name: "Hybrid thinking, agent RL", tag: "R1-0528 and V3.1: deeper reasoning, tool calling, hybrid thinking modes",
    note: "After R1, DeepSeek released R1-0528, a further post-trained R1 with longer and more careful reasoning and support for function calling, and then V3.1, which put thinking and non-thinking behaviour into a single checkpoint selected by the chat template and shifted post-training toward agent and tool-use tasks. The mechanism carried forward is that one model now serves both fast and deliberate modes, which V3.2 and V4 formalize as mode and effort control. No paper text is available for these releases, so specific figures are omitted.",
    evidence: "Model releases without a paper in the corpus (R1-0528 May 2025, V3.1 Aug 2025); V3.2 later notes keep-routing had been in its RL pipeline since V3-0324 (V3.2 §3.1)", papers: ["r1-0528", "v31"], buildsOn: ["b-r1"] },
  { id: "b-rlscale", lane: "rl", name: "Scalable RL framework", tag: "V3.2: a stable recipe for scaling GRPO compute and agentic RL",

  { id: "b-promax", lane: "rl", name: "Reasoning-effort modes", tag: "V4 and V4.1: specialists via GRPO, merged by on-policy distillation, effort-conditioned",
    note: "V4 keeps the V3.2 specialist pipeline (SFT then GRPO) but replaces the mixed RL stage with multi-teacher on-policy distillation: the student minimizes reverse KL to over ten expert teachers, and three reasoning modes come from different length penalties and context windows, Pro-Max adding a max-effort system prompt. V4.1 adds a 1 to 100 effort scalar whose length penalty decays with effort, trains DSpark alongside the backbone without back-propagating into it so the drafter tracks the evolving policy, simulates SWA Bounded Replay in post-training, and distills from over 40 teachers.",

  { id: "b-engram", lane: "mem", name: "Engram conditional memory", tag: "Engram: hashed N-gram conditional memory as a second sparsity axis",
    note: "Transformers have no lookup primitive, so early layers burn compute reconstructing static multi-token patterns. Engram compresses token IDs to canonical forms, hashes suffix N-grams with multiple heads into embedding tables for O(1) lookup, and adds the gated result residually. Framing MoE versus memory as a Sparsity Allocation problem gives a U-shaped loss curve whose optimum is stable across scales. Because lookups absorb local dependencies, attention is freed for global context, and deterministic addressing lets tables live in host memory with prefetch.",
    evidence: "Optimum at rho 75 to 80% (20 to 25% of sparse budget to Engram), loss 1.7248 to 1.7109 in the 10B regime; Engram-27B vs iso-FLOPs MoE-27B: MMLU +3.4, BBH +5.0, Multi-Query NIAH 84.2 to 97.0, Variable Tracking 77.0 to 89.0; 100B table on host memory under 3% overhead (Engram abstract, §3.1, Table 2)", papers: ["engram"], buildsOn: ["b-moe"] },
  { id: "b-1m", lane: "mem", name: "Million-token context", tag: "DeepSeek-V4: one-million-token context as a routine capability",
    note: "Quadratic attention was the stated ceiling on test-time scaling and long-horizon agentic work. Instead of a post-hoc YaRN patch, V4 trains long context inside pretraining: sequence length grows 4K to 16K to 64K to 1M, dense attention for the first 1T tokens, then indexer warm-up and sparse CSA from 64K onward. The serving side adds a heterogeneous KV cache with on-disk storage for shared-prefix reuse, and the RL framework is rebuilt to handle million-token rollouts. Evaluation moves to MRCR 1M and CorpusQA 1M.",

  { id: "b-engram-prod", lane: "mem", name: "196B Engram in production", tag: "196B Engram in production with host-DRAM prefetch and bounded replay",
    note: "V4.1-Flash turns the Engram result into a 552B-backbone production model and reworks where long-context memory lives. Two Engram modules at layers 1 and 14 hold 196B parameters in FP8 tables, prefetched from host memory by background RDMA; the causal convolution is dropped and tables use momentum plus Sinkhorn updates. Sparse attention trains from scratch at 64K and extends to 1M at 34T tokens. Sliding-window KV leaves the persistent cache for a 10% host-DRAM pool, and SWA Bounded Replay recomputes only the last 128 tokens on a miss.",

  { id: "b-mhc", lane: "topo", name: "mHC", tag: "Sinkhorn-constrained Hyper-Connections restore identity mapping at scale",
    note: "Hyper-Connections widen the residual stream from C to n times C with learnable mixing matrices, but the unconstrained residual matrix breaks identity mapping: the composite product across layers stops preserving the feature mean, gains explode with depth, 27B training destabilizes, and memory access grows about n-fold. mHC projects the residual matrix onto the Birkhoff polytope with 20 Sinkhorn-Knopp iterations, so each map is a convex combination with spectral norm at most 1 that survives composition. TileLang kernels, recomputation and an extended DualPipe schedule keep overhead small.",

    note: "With the stability fix proven at 27B, V4 needed to carry a widened residual stream through trillion-parameter MoE training that already suffered loss spikes from MoE outliers. V4 adopts mHC as one of three headline upgrades, keeping the doubly stochastic residual map, sigmoid-bounded input and output maps and dynamic plus static parameterization, and adds fused training and inference kernels, selective checkpointing, DualPipe 1F1B adjustments and a deterministic split-k reduction for the tiny mHC matmul. The static biases and gates of mHC stay on AdamW while the rest moves to Muon.",
    evidence: "n_hc equal 4 and t_max equal 20 for both V4-Flash (284B total, 13B active) and V4-Pro (1.6T total, 49B active); mHC wall-time overhead 6.7% of the overlapped 1F1B stage; V4-Pro trained on 33T tokens (V4 Sec 2.2, 3.4.2, 4.2.1)", papers: ["v4"], buildsOn: ["b-mhc"] },
  { id: "b-mhc-sp", lane: "topo", name: "Single-Pass mHC", tag: "Single-Pass mHC: one kernel, residual read once, traffic halved",
    note: "In V4 the mHC step ran as three sequential kernels because the mixing coefficients A_l need a full reduction over X_l; with the pre-norm this moved (4n+4)d activation elements per token, twice the (2n+2)d lower bound. V4.1-Flash shifts the mixing coefficients by one block, so block l mixes with A_{l-1}, and the dependency disappears at negligible cost. The deployment Mega-mHC kernel tiles X_l along the hidden dimension, fuses update, mixing, prediction, pre-norm and FP8 conversion, and touches the residual once. Expansion 4 and 20 iterations carry forward.",

  { id: "b-code", lane: "dom", name: "Code intelligence", tag: "Repository-level code pre-training with FIM and 16K window",
    note: "Open code models trailed closed ones, and file-level training ignored cross-file structure. DeepSeek-Coder trained 1.3B, 6.7B and 33B models from scratch on 2T tokens (87% source code, 10% English code-related text, 3% Chinese), deduplicated at repository level and packed files in topological dependency order so the model sees whole projects. A fill-in-the-middle objective at a 50% PSM rate balances infilling against completion, and RoPE was reconfigured to extend context to 16K. This data recipe became the base for DeepSeekMath and later general models.",

  { id: "b-mathdom", lane: "dom", name: "Math corpus mining", tag: "120B-token math corpus mined from Common Crawl with iterative fastText",
    note: "Competition-level math needed far more math text than existing open corpora offered. Starting from OpenWebMath as seed, DeepSeekMath trained a fastText classifier to recall math pages from deduplicated Common Crawl, then used domain statistics to find uncollected math-heavy domains, relabel, and retrain; after four iterations 35.5M pages gave 120B tokens, about 9 times OpenWebMath. DeepSeekMath-Base 7B continues from DeepSeek-Coder-Base-v1.5 7B for 500B tokens (56% math corpus plus code and text), directly inheriting the previous block. The GRPO algorithm is introduced in the same paper but belongs to the RL lane.",

    note: "Extending the LLM to images raised two problems: a single CLIP-style encoder misses fine detail such as OCR and charts, and multimodal training erodes language ability. DeepSeek-VL pairs SigLIP-L at 384x384 for semantics with SAM-B at 1024x1024 for detail, compressing a high-resolution image into 576 visual tokens. Data is built from a use-case taxonomy of real user scenarios (screenshots, PDFs, OCR, charts), and pre-training keeps language data at roughly 70% because performance per modality tracks its share. Design was iterated on 1.3B then scaled to 7B on DeepSeek-LLM.",

/* Blocks that sit in the capstone row at the top (converging point). */
const CAPSTONE = ["b-csa2", "b-engram-prod", "b-ced"];

/* ===================================================================== end DATA */

const $ = s => document.querySelector(s);
const byId = Object.fromEntries(PAPERS.map(p => [p.id, p]));
const themeById = Object.fromEntries(THEMES.map(t => [t.id, t]));
const blockById = Object.fromEntries(BLOCKS.map(b => [b.id, b]));
const fmt = d => { const [y, m, day] = d.split("-").map(Number); return new Date(y, m - 1, day).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" }); };
const themeColor = id => themeById[id].color;
let activeTheme = null;   // filter in timeline view
let view = "timeline";

/* ---------- Legend ---------- */
function renderLegend() {
  const el = $("#legend"); el.innerHTML = "";
  THEMES.forEach(t => {
    const c = document.createElement("button");
    c.className = "chip"; c.style.setProperty("--c", t.color);
    c.innerHTML = `<span class="dot"></span>${t.name}`;
    c.onclick = () => { activeTheme = activeTheme === t.id ? null : t.id; applyFilter(); };
    c.dataset.theme = t.id;
    el.appendChild(c);
  });
  applyFilter();
}
function applyFilter() {
  document.querySelectorAll(".chip").forEach(c => {
    c.classList.toggle("active", c.dataset.theme === activeTheme);
    c.classList.toggle("dim", activeTheme && c.dataset.theme !== activeTheme);
  });
  document.querySelectorAll("#view-timeline .block").forEach(b => {
    const p = byId[b.dataset.id];
    b.classList.toggle("dim", activeTheme && !p.themes.includes(activeTheme));
  });
  document.querySelectorAll("#view-themes .block").forEach(b => {
    const bl = blockById[b.dataset.block];
    b.classList.toggle("dim", activeTheme && bl.lane !== activeTheme);
  });
  document.querySelectorAll("#edges path").forEach(pth => {
    pth.classList.toggle("faded", activeTheme && pth.dataset.lane !== activeTheme);
  });
  $("#hint").textContent = view === "timeline"
    ? (activeTheme ? `Showing papers tagged “${themeById[activeTheme].name}”. Click the chip again to clear.` : "Newest at the top. Click a theme chip to highlight the papers in that thread.")
    : "Each lane is a thread of ideas. Lines show what each block builds on. Hover a block to trace its lineage; click for the paper summary.";
}

/* ---------- Timeline ---------- */
function paperBlock(p, compact) {
  const b = document.createElement("button");
  b.className = "block" + (p.kind === "external" ? " external" : p.kind !== "paper" ? " release" : "");
  b.dataset.id = p.id;
  b.style.setProperty("--c", themeColor(p.themes[0]));
  b.innerHTML = `
    <div class="date">${fmt(p.date)}${p.arxiv ? " &middot; " + p.arxiv : ""}${p.kind === "paper" ? "" : `<span class="kind">${p.kind}</span>`}</div>
    <div class="name">${p.name}</div>
    <div class="tag">${p.tag}</div>
    <div class="tdots">${p.themes.map(t => `<span style="background:${themeColor(t)}" title="${themeById[t].name}"></span>`).join("")}</div>`;
  b.onclick = () => openPaper(p.id);
  return b;
}
function renderTimeline() {
  const root = $("#view-timeline"); root.innerHTML = "";
  const years = [...new Set(PAPERS.map(p => p.date.slice(0, 4)))].sort().reverse();
  years.forEach(y => {
    const ps = PAPERS.filter(p => p.date.startsWith(y)).sort((a, b) => b.date.localeCompare(a.date));
    const row = document.createElement("div"); row.className = "yearrow";
    row.innerHTML = `<div class="yearlabel"><div class="y">${y}</div><div class="n">${ps.length} ${ps.length === 1 ? "entry" : "entries"}</div></div>`;
    const grid = document.createElement("div"); grid.className = "papers";
    ps.forEach(p => grid.appendChild(paperBlock(p)));
    row.appendChild(grid);
    root.appendChild(row);
  });
}

/* ---------- Themes ---------- */
function ideaBlock(b) {
  const el = document.createElement("button");
  el.className = "block" + (b.papers.every(id => byId[id].kind === "external") ? " external" : ""); el.dataset.block = b.id;
  el.style.setProperty("--c", themeColor(b.lane));
  const papers = b.papers.map(id => byId[id]);
  const dates = papers.map(p => p.date).sort();
  el.innerHTML = `
    <div class="date">${fmt(dates[0]).replace(/^(\w+) \d+, /, "$1 ")}${dates.length > 1 && dates[0].slice(0,7) !== dates[dates.length-1].slice(0,7) ? " &rarr; " + fmt(dates[dates.length-1]).replace(/^(\w+) \d+, /, "$1 ") : ""}</div>
    <div class="name">${b.name}</div>
    <div class="tag">${b.tag}</div>
    ${b.note ? `<div class="note">${b.note}</div>` : ""}
    ${b.evidence ? `<div class="ev">${b.evidence}</div>` : ""}
    <div class="refs">${papers.map(p => `<span>${p.name}</span>`).join("")}</div>`;
  el.onclick = () => openBlock(b.id);
  el.onmouseenter = () => highlightLineage(b.id);
  el.onmouseleave = () => highlightLineage(null);
  el.onfocus = () => highlightLineage(b.id);
  el.onblur = () => highlightLineage(null);
  return el;
}
function renderThemes() {
  const lanes = $("#lanes"); lanes.innerHTML = "";
  const heads = $("#laneheads"); heads.innerHTML = "";
  const cap = $("#capstone"); cap.innerHTML = "";
  THEMES.forEach(t => {
    const lane = document.createElement("div"); lane.className = "lane"; lane.dataset.lane = t.id;
    const head = document.createElement("button"); head.className = "lanehead"; head.style.setProperty("--c", t.color);
    head.innerHTML = `${t.name}<small>${t.sub}</small>${t.evolution ? `<span class="more">Click for the story of this thread</span>` : ""}`;
    head.onclick = () => openTheme(t.id);
    heads.appendChild(head);
    BLOCKS.filter(b => b.lane === t.id && !CAPSTONE.includes(b.id))
      .sort((a, b) => minDate(a).localeCompare(minDate(b)))
      .forEach(b => lane.appendChild(ideaBlock(b)));
    lanes.appendChild(lane);
  });
  CAPSTONE.forEach(id => cap.appendChild(ideaBlock(blockById[id])));
  requestAnimationFrame(drawEdges);
}
function minDate(b) { return b.papers.map(id => byId[id].date).sort()[0]; }

function drawEdges() {
  const svg = $("#edges"); const wrap = $("#themes-wrap");
  const W = wrap.clientWidth, H = wrap.scrollHeight;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.style.height = H + "px";
  svg.innerHTML = "";
  const wr = wrap.getBoundingClientRect();
  const pos = {};
  wrap.querySelectorAll(".block[data-block]").forEach(el => {
    const r = el.getBoundingClientRect();
    pos[el.dataset.block] = { x: r.left - wr.left + r.width / 2, top: r.top - wr.top, bottom: r.bottom - wr.top, w: r.width };
  });
  BLOCKS.forEach(b => b.buildsOn.forEach(src => {
    const a = pos[src], c = pos[b.id]; if (!a || !c) return;
    const x1 = a.x, y1 = a.top, x2 = c.x, y2 = c.bottom;
    const dy = Math.max(24, (y1 - y2) / 2);
    const d = `M${x1},${y1} C${x1},${y1 - dy} ${x2},${y2 + dy} ${x2},${y2}`;
    const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
    p.setAttribute("d", d); p.setAttribute("stroke", themeColor(blockById[src].lane));
    p.dataset.from = src; p.dataset.to = b.id; p.dataset.lane = blockById[src].lane;
    if (activeTheme && p.dataset.lane !== activeTheme) p.classList.add("faded");
    svg.appendChild(p);
  }));
}
function lineage(id) {
  const anc = new Set(), desc = new Set();
  const up = x => blockById[x].buildsOn.forEach(s => { if (!anc.has(s)) { anc.add(s); up(s); } });
  const down = x => BLOCKS.filter(b => b.buildsOn.includes(x)).forEach(b => { if (!desc.has(b.id)) { desc.add(b.id); down(b.id); } });
  up(id); down(id);
  return new Set([id, ...anc, ...desc]);
}
function highlightLineage(id) {
  const set = id ? lineage(id) : null;
  document.querySelectorAll("#view-themes .block").forEach(el => {
    el.classList.toggle("hl", !!set && set.has(el.dataset.block));
  });
  document.querySelectorAll("#edges path").forEach(p => {
    const on = !!set && set.has(p.dataset.from) && set.has(p.dataset.to);
    p.classList.toggle("hl", on);
    if (set) p.classList.toggle("faded", !on); else p.classList.toggle("faded", activeTheme && p.dataset.lane !== activeTheme);
  });
}

/* ---------- Drawer ---------- */
function openDrawer(html) {
  $("#drawer-body").innerHTML = html;
  $("#drawer").classList.add("open"); $("#overlay").classList.add("open");
  $("#drawer").setAttribute("aria-hidden", "false"); $("#drawer").scrollTop = 0;
}
function closeDrawer() {
  $("#drawer").classList.remove("open"); $("#overlay").classList.remove("open");
  $("#drawer").setAttribute("aria-hidden", "true");
}
function paperHTML(p) {
  const leadsTo = PAPERS.filter(q => q.buildsOn.includes(p.id));
  const blocks = BLOCKS.filter(b => b.papers.includes(p.id));
  const kindNote = p.kind === "release" ? `<div class="note">Model release with release notes rather than a paper; included for continuity of the thread.</div>`
                 : p.kind === "external" ? `<div class="note">External paper, not from DeepSeek. Included because V4.1-Flash cites it as the origin of the encoder-decoder split.</div>` : "";
  return `
    <div class="eyebrow">${fmt(p.date)}${p.arxiv ? " &middot; arXiv:" + p.arxiv : ""}${p.venue ? " &middot; " + p.venue : ""}</div>
    <h2>${p.name}</h2>
    <div class="full">${p.title}</div>
    <div class="themes">${p.themes.map(t => `<span style="--c:${themeColor(t)}">${themeById[t].name}</span>`).join("")}</div>
    <div class="links">
      ${p.summary ? `<a class="primary" href="${p.summary}" target="_blank" rel="noopener">Detailed summary</a>` : ""}
      ${p.arxiv ? `<a href="https://arxiv.org/abs/${p.arxiv}" target="_blank" rel="noopener">arXiv abstract</a><a href="https://arxiv.org/pdf/${p.arxiv}" target="_blank" rel="noopener">arXiv PDF</a>` : ""}
      ${p.pdf ? `<a href="${p.pdf}" target="_blank" rel="noopener">Local PDF</a>` : ""}
    </div>
    ${p.summary ? "" : `<div class="note">No detailed summary linked yet. Set <code>summary: "summaries/${p.id}.html"</code> in the DATA block and drop the file in the summaries folder.</div>`}
    ${kindNote}
    <h3>Summary</h3>
    <p>${p.abstract}</p>
    <h3>Key contributions</h3>
    <ul>${p.points.map(x => `<li>${x}</li>`).join("")}</ul>
    ${p.buildsOn.length ? `<h3>Builds on</h3><ul class="rel">${p.buildsOn.map(id => `<li><button onclick="openPaper('${id}')">${byId[id].name}</button> <span style="color:var(--muted);font-size:12px">${fmt(byId[id].date)}</span></li>`).join("")}</ul>` : ""}
    ${leadsTo.length ? `<h3>Leads to</h3><ul class="rel">${leadsTo.map(q => `<li><button onclick="openPaper('${q.id}')">${q.name}</button> <span style="color:var(--muted);font-size:12px">${fmt(q.date)}</span></li>`).join("")}</ul>` : ""}
    ${blocks.length ? `<h3>Idea blocks in the Themes view</h3><ul class="rel">${blocks.map(b => `<li><button onclick="openBlock('${b.id}')">${b.name}</button> <span style="color:${themeColor(b.lane)};font-size:12px">${themeById[b.lane].name}</span></li>`).join("")}</ul>` : ""}
  `;
}
function openPaper(id) { openDrawer(paperHTML(byId[id])); }
function openBlock(id) {
  const b = blockById[id];
  const papers = b.papers.map(pid => byId[pid]);
  const next = BLOCKS.filter(x => x.buildsOn.includes(id));
  openDrawer(`
    <div class="eyebrow" style="color:${themeColor(b.lane)}"><button onclick="openTheme('${b.lane}')" style="background:none;border:0;color:inherit;font:inherit;cursor:pointer;padding:0">${themeById[b.lane].name} &rarr; theme story</button></div>
    <h2>${b.name}</h2>
    <div class="full">${b.tag}</div>
    ${b.note ? `<h3>What changed here</h3><p class="story">${b.note}</p>` : ""}
    ${b.evidence ? `<div class="note">${b.evidence}</div>` : ""}
    <h3>Papers in this block</h3>
    <ul class="rel">${papers.map(p => `<li><button onclick="openPaper('${p.id}')">${p.name}</button> <span style="color:var(--muted);font-size:12px">${fmt(p.date)}</span></li>`).join("")}</ul>
    ${b.buildsOn.length ? `<h3>Builds on</h3><ul class="rel">${b.buildsOn.map(x => `<li><button onclick="openBlock('${x}')">${blockById[x].name}</button></li>`).join("")}</ul>` : ""}
    ${next.length ? `<h3>Leads to</h3><ul class="rel">${next.map(x => `<li><button onclick="openBlock('${x.id}')">${x.name}</button></li>`).join("")}</ul>` : ""}
    <h3>From the papers</h3>
    ${papers.map(p => `<p><strong>${p.name}.</strong> ${p.abstract}</p>`).join("")}
  `);
}

function openTheme(id) {
  const t = themeById[id];
  const blocks = BLOCKS.filter(b => b.lane === id).sort((a, b) => minDate(a).localeCompare(minDate(b)));
  const papers = [...new Set(blocks.flatMap(b => b.papers))].map(pid => byId[pid]).sort((a, b) => a.date.localeCompare(b.date));
  openDrawer(`
    <div class="eyebrow" style="color:${t.color}">Theme</div>
    <h2>${t.name}</h2>
    <div class="full">${t.sub}</div>
    ${t.evolution ? `<h3>How the thread evolved</h3><p class="story">${t.evolution}</p>` : ""}
    ${t.today ? `<h3>Relevance today</h3><div class="today">${t.today}</div>` : ""}
    <h3>Blocks, oldest first</h3>
    <ul class="rel">${blocks.map(b => `<li><button onclick="openBlock('${b.id}')">${b.name}</button> <span style="color:var(--muted);font-size:12px">${fmt(minDate(b)).replace(/^(\w+) \d+, /, "$1 ")}</span></li>`).join("")}</ul>
    <h3>Papers in this theme</h3>
    <ul class="rel">${papers.map(p => `<li><button onclick="openPaper('${p.id}')">${p.name}</button> <span style="color:var(--muted);font-size:12px">${fmt(p.date)}</span></li>`).join("")}</ul>
  `);
}

/* ---------- View switching ---------- */
function setView(v) {
  view = v;
  $("#btn-timeline").classList.toggle("active", v === "timeline");
  $("#btn-themes").classList.toggle("active", v === "themes");
  $("#view-timeline").classList.toggle("active", v === "timeline");
  $("#view-themes").classList.toggle("active", v === "themes");
  try { localStorage.setItem("dsmap-view", v); } catch (e) {}
  document.body.dataset.view = v;
  if (v === "themes") requestAnimationFrame(drawEdges);
  applyFilter();
}
let notesOn = true;
try { notesOn = localStorage.getItem("dsmap-notes") !== "off"; } catch (e) {}
function applyNotes() {
  $("#view-themes").classList.toggle("compact", !notesOn);
  $("#btn-notes").textContent = "Notes: " + (notesOn ? "on" : "off");
  requestAnimationFrame(drawEdges);
}
$("#btn-notes").onclick = () => { notesOn = !notesOn; try { localStorage.setItem("dsmap-notes", notesOn ? "on" : "off"); } catch (e) {} applyNotes(); };
$("#btn-timeline").onclick = () => setView("timeline");
$("#btn-themes").onclick = () => setView("themes");
$("#drawer-close").onclick = closeDrawer;
$("#overlay").onclick = closeDrawer;
document.addEventListener("keydown", e => { if (e.key === "Escape") closeDrawer(); });
window.addEventListener("resize", () => { if (view === "themes") drawEdges(); });
$("#btn-theme-toggle").onclick = () => {
  const cur = document.documentElement.getAttribute("data-theme");
  const dark = cur ? cur === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  const next = dark ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try { localStorage.setItem("dsmap-theme", next); } catch (e) {}
};

/* ---------- Init ---------- */
try { const t = localStorage.getItem("dsmap-theme"); if (t) document.documentElement.setAttribute("data-theme", t); } catch (e) {}
renderLegend(); renderTimeline(); renderThemes();
let initial = "timeline"; try { initial = localStorage.getItem("dsmap-view") || "timeline"; } catch (e) {}
setView(initial); applyNotes();
</script>
</body>
